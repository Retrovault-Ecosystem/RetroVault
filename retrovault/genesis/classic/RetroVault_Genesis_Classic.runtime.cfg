# RetroVault Genesis / Mega Drive CLASSIC_4_3 runtime contract.
#
# Genesis Plus GX remains authoritative for source geometry and
# core-reported display aspect. RetroVault must not replace dynamic
# SET_GEOMETRY changes with title-specific or raster-specific viewport
# tables.
#
# The 1920x1080 CLASSIC_4_3 master profile supplies the presentation
# envelope. It is not a forced emulator framebuffer resolution.
#
# Overscan is explicitly preserved until Genesis-specific evidence
# justifies a different system/core policy.
video_force_aspect = "true"
video_aspect_ratio_auto = "true"
video_crop_overscan = "false"
video_scale_integer = "false"
