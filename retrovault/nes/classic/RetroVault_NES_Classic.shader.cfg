# RetroVault NES Classic
#
# UNIVERSAL SINGLE-GEOMETRY-AUTHORITY CONTRACT
#
# Minimal runtime shader descriptor.
#
# RetroVault/RetroArch owns final gameplay viewport geometry.
# The external NES CRT preset supplies visual treatment only.
#
# The shader runtime deliberately exposes only the two historically
# required NES parameters, and both are geometry-neutral:
#
#   HSM_NON_INTEGER_SCALE = 100%
#   HSM_SCREEN_POSITION_Y = 0
#
# This prevents a second shader-side scale/position authority and provides
# no unwanted thick black inset around the gameplay image.
#
# No title-specific geometry is permitted here. Every NES title using the
# production package receives the same system-level presentation contract.

HSM_NON_INTEGER_SCALE = "100.000000"
HSM_SCREEN_POSITION_Y = "0.000000"
